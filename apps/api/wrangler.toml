name = "vault-verify"
main = "src/index.ts"
compatibility_date = "2026-10-30"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "attest-db"
database_id = "278d52ab-62bf-47c0-9b90-4b8d7e7d65da"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "attest-artifacts"

[[queues.producers]]
binding = "GRADE_QUEUE"
queue = "grade-queue"

[[queues.consumers]]
queue = "grade-queue"
max_batch_size = 1
max_retries = 3

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
